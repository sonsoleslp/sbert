url: https://sonsoles.me/sbert

template:
  bootstrap: 5
  bootswatch: yeti

authors:
  Mohammed Saqr:
    href: https://saqr.me
  Sonsoles López-Pernas:
    href: https://sonsoles.me

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
- title: Overview
  contents:
  - sbert-package

- title: Encoding text
  desc: Turn text into Sentence-BERT embeddings and compare them.
  contents:
  - encode
  - pool
  - topic_similarity

- title: Models and runtime
  desc: >
    Install the ONNX Runtime, download revision-pinned models, load custom
    Hugging Face exports, and manage the on-disk cache.
  contents:
  - models
  - model_download
  - load_model
  - load_custom
  - model_status
  - model_remove
  - install_runtime
  - cache_dir
  - cache_size

- title: Preparing a corpus
  desc: Deduplicate, clean, segment, and context-blend documents before modeling.
  contents:
  - dedupe
  - clean_corpus
  - strip_list_markers
  - content_ratio
  - segment
  - abbreviations
  - blend
  - stop_words

- title: Fitting topic models
  desc: Prepare a corpus once, fit topics, compare topic counts, and merge topics.
  contents:
  - topic_corpus
  - topics
  - compare_topics
  - fitted.sbert_topic_sweep
  - reduce_topics

- title: Describing topics
  desc: Distinctive terms, representative texts, names, sizes, and keywords.
  contents:
  - terms.sbert_topic_model
  - representatives
  - name_topics
  - topic_sizes
  - keywords

- title: Assigning topics
  desc: Assign new documents and recover soft memberships and topic mixtures.
  contents:
  - predict.sbert_topic_model
  - topic_membership
  - topic_gamma

- title: Evaluating topics
  desc: Coherence, diversity, and the hierarchy of topic centers.
  contents:
  - coherence
  - topic_diversity
  - topic_hierarchy
  - summary.sbert_topic_model
  - summary.sbert_topic_sweep
  - summary.sbert_topic_hierarchy

- title: Plots
  desc: Deterministic base-graphics displays of models, comparisons, and hierarchies.
  contents:
  - plot.sbert_topic_model
  - plot.sbert_topic_sweep
  - plot.sbert_topic_hierarchy
  - topic_palette

- title: Results
  desc: Tidy tables of result objects, and their print methods.
  contents:
  - as.data.frame.sbert_topic_model
  - as.data.frame.sbert_topic_sweep
  - as.data.frame.sbert_topic_hierarchy
  - as.data.frame.sbert_topic_corpus
  - print.sbert_model
  - print.sbert_topic_corpus
  - print.sbert_topic_model
  - print.sbert_topic_hierarchy
  - print.sbert_topic_sweep
  - print.summary.sbert_topic_model
  - print.summary.sbert_topic_sweep
  - print.summary.sbert_topic_hierarchy

- title: Data
  desc: Bundled corpora and precomputed embeddings for offline examples.
  contents:
  - feedback_translations
  - feedback_embeddings
  - covid

